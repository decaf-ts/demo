<section [class.muted]="backgroundColor === 'muted'">
  <app-container size="2xlarge">
    <div class="dcf-flex dcf-flex-center">
      <div class="dcf-flex">
        <div class="info dcf-text-center">
          <div class="meta">{{ meta }}</div>
          <h1 class="title dcf-text-bold fs-1">{{ title }}</h1>
          <p class="description dcf-width-2-3 mx-auto">{{ description }}</p>
        </div>
      </div>
    </div>
    <div
      class="dcf-flex dcf-flex-center dcf-grid dcf-grid-small dcf-child-width-1-1@m dcf-child-width-1-2@l dcf-padding-small dcf-margin-medium-top">
      @for (
      faq of questions; let idx = $index; track faq.question + idx
      ) {
      <div class="">
        <div class="my-3 p-3" [style.animationDelay]="idx * 200 + 'ms'">
          <div translate class="dcf-text-bold question">{{faq.question}}</div>
          <div class="mt-3 info dcf-text-justify">{{faq.answer}}</div>
        </div>
      </div>
      }
    </div>
  </app-container>
</section>
