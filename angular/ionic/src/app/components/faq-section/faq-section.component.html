<section [class.muted]="backgroundColor === 'muted'">
  <app-container size="2xlarge">
    <div class="dcf-flex dcf-flex-center">
      <div class="dcf-flex">
        <div class="info dcf-text-center">
          <div class="meta">{{ meta }}</div>
          <h1 class="title dcf-text-bold fs-1">{{ title }}</h1>
          <p class="description dcf-width-2-3 mx-auto">{{ description }}</p>
        </div>
      </div>
    </div>
    <ion-grid class="mt-5">
      <ion-row class="">
        @for(faq of questions; let idx = $index; track faq.question + idx){
        <ion-col class="dcf-padding-small dcf-padding-remove-top dcf-padding-remove-bottom " size="12" size-md="6">
          <div class="my-4 dcf-padding-small dcf-padding-remove-top dcf-padding-remove-bottom">
            <div class="dcf-text-bold question">{{faq.question}}</div>
            <div class="mt-3 info dcf-text-justify">{{faq.answer}}</div>
          </div>
        </ion-col>
        }
      </ion-row>
    </ion-grid>
  </app-container>
</section>
